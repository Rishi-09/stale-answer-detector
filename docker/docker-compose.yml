version: "3.8"

services:
  bifrost-gateway:
    build:
      context: ..
      dockerfile: stale-answer-detector/docker/Dockerfile.build
    container_name: bifrost-staledetector
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TAVILY_API_KEY=${TAVILY_API_KEY:-mock-tavily-key}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-openai-key}
    volumes:
      - ./config.json:/app/data/config.json:ro
      - ../build:/app/data/plugins:ro
      - ../logs:/app/data/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

